<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — humoridze</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#10131a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .miss {
      min-height: 100svh;
      display: grid;
      place-content: center;
      gap: 1rem;
      padding: var(--pad);
      text-align: center;
    }
    .miss h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(4rem, 12vw, 7rem);
      letter-spacing: -0.06em;
      line-height: 0.9;
    }
    .miss p {
      margin: 0;
      color: var(--ink-soft);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="miss">
    <h1>404</h1>
    <p>Страница не найдена</p>
    <div class="hero__cta" style="justify-content: center; margin-top: 0.5rem;">
      <a class="btn btn--solid" href="/">На главную</a>
      <a class="btn btn--ghost" href="/en/">English</a>
    </div>
  </main>
</body>
</html>
